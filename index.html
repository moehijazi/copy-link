<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copying...</title>
  <script>
    window.onload = function() {
      // The text/code you want to copy
      const textToCopy = "123123";
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Copied to clipboard: " + textToCopy);
        // Optional: Send them back to your Canva site or another page
        // window.location.href = "https://husseinmaha.my.canva.site/weddinginvite2";
      }).catch(err => {
        console.error("Failed to copy text: ", err);
      });
    };
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Copying to clipboard...</p>
</body>
</html>
